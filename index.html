<script>
const KEY='golf-round-v1';
// 完成的球局
let ROUNDS=(()=>{try{return JSON.parse(localStorage.getItem('golf-rounds'))||[]}catch(e){return[]}})();
function saveRounds(){try{localStorage.setItem('golf-rounds',JSON.stringify(ROUNDS.slice(0,200)))}catch(e){}}
function endRound(keep){
  if(keep&&S)ROUNDS.unshift({...S,done:Date.now()}),saveRounds();
  S=null;try{localStorage.removeItem(KEY)}catch(e){}
  SHOT=null;try{localStorage.removeItem('golf-shot')}catch(e){}
  START.step='home';view='start';render();window.scrollTo(0,0);
  if(keep)avgToast(`${ic('check',28)}<div style="font-size:18px;font-weight:700;margin-top:4px">已儲存</div><div class="hint">到「成績」可以看過去的紀錄</div>`);
}
function finishRound(){
  let n=0;S.players[0].score.forEach(x=>{if(x!=null)n++});
  confirmBox(`完成並儲存這一場？${n<S.holes?`<div class="hint">還有 ${S.holes-n} 洞沒有記分。</div>`:''}`,()=>endRound(true));
}
function abandonRound(){confirmBox('放棄這一場？<div class="hint">這一場的桿數不會保存。</div>',()=>endRound(false))}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function newRound(course,names,holes,nines){

}

function ic(n,sz,extra){return`<svg class="ic ic-${n}" viewBox="0 0 24 24" width="${sz||22}" height="${sz||22}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra||''}>${ICONS[n]||''}</svg>`}

document.getElementById('nav').innerHTML=[['play','flag','記分'],['map','map','地圖'],['caddie','cap','電子桿弟'],['bag','bag','球桿'],['card','trophy','成績']]
  .map(([v,i,t])=>`<button data-v="${v}">${ic(i,26)}<span>${t}</span></button>`).join('');

// 洞的編號：一般 1–18，或 27 洞球場的 A／B／C 球道
// 球道代號：OUT＝1–9 洞、IN＝10–18 洞（一般 18 洞球場）；A／B／C／D＝27、36 洞球場的球道
const nineLabel=n=>n==='OUT'?'1–9 洞':n==='IN'?'10–18 洞':n+' 球道';
const holeKey=(nines,i)=>{const n=nines?nines[Math.floor(i/9)]:null;return !n?String(i+1):n==='OUT'?String(i%9+1):n==='IN'?String(i%9+10):n+(i%9+1)};
const hk=i=>holeKey(S&&S.nines,i);      // 存資料用的鍵
const hs=i=>holeKey(S&&S.nines,i);      // 短標籤，例如 A1、12
const holeTitle=i=>{const n=S&&S.nines?S.nines[Math.floor(i/9)]:null;return n&&n!=='OUT'&&n!=='IN'?`${n} 球道第 ${i%9+1} 洞`:`第 ${hk(i)} 洞`};
function vsPar(n){return n===0?'E':(n>0?'+'+n:''+n)}
function totals(p,from=0,to=S.holes){
  let s=0,par=0,played=0;
  for(let i=from;i<to;i++){if(p.score[i]!=null){s+=p.score[i];par+=S.pars[i];played++}}
  return {s,par,diff:s-par,played};
}
function cls(score,par){if(score==null)return'';const d=score-par;return d<=-2?'eagle':d==-1?'birdie':d==1?'bogey':d>=2?'dbl':''}
function label(score,par){
  const d=score-par;
  if(score===1)return['一桿進洞！','t-e'];
  if(d<=-3)return['信天翁','t-e'];if(d==-2)return['老鷹','t-e'];if(d==-1)return['博蒂','t-b'];
  if(d==0)return['平標準桿','t-p'];if(d==1)return['柏忌','t-o'];if(d==2)return['雙柏忌','t-d'];return['+'+d,'t-d'];
}

function render(){

  if(S){$('#title').textContent='⛳ '+(S.course||'高爾夫記分卡');
    const p=S.players[0],t=totals(p);$('#sub').textContent=S.date+(S.tee?'・'+S.tee+' tee':'')+'・'+p.name+' '+(t.played?t.s+'桿 ('+vsPar(t.diff)+')':'尚未記分');}

}

// 過去的成績
function roundTotals(R,p,from=0,to=R.holes){let s=0,par=0,n=0;for(let i=from;i<to;i++){if(p.score[i]!=null){s+=p.score[i];par+=R.pars[i];n++}}return{s,par,diff:s-par,n}}
let openRound=null;
function historyHTML(){
  if(!ROUNDS.length)return S?'':`<div class="card" style="text-align:center;color:var(--mute)">${ic('trophy',40)}<div style="margin-top:6px">還沒有完成的球局</div></div>`;
  return`<div class="card"><b>${ic('trophy',20)} 過去的成績</b>${ROUNDS.map((R,k)=>{const p=R.players[0],t=roundTotals(R,p),op=openRound===k;
    const lab=R.nines?R.nines.map(nineLabel).join(' → '):R.holes+' 洞';
    return`<div class="hrow"><button class="hbtn" data-hr="${k}"><span><b>${esc(R.course||'')}</b><small>${R.date}${R.tee?'・'+R.tee+' tee':''}・${lab}</small></span>
      <span class="hs"><b>${t.n?t.s:'—'}</b><small>${t.n?vsPar(t.diff):''}</small></span></button>
      ${op?`<div class="tablewrap" style="margin-top:6px"><table>${[0,9].filter(a=>a<R.holes).map(a=>{const idx=[...Array(9).keys()].map(x=>x+a);
        return`<tr><th class="nm">洞</th>${idx.map(i=>`<th>${holeKey(R.nines,i)}</th>`).join('')}<th>計</th></tr>
        <tr><td class="nm">Par</td>${idx.map(i=>`<td>${R.pars[i]}</td>`).join('')}<td class="sub">${idx.reduce((x,i)=>x+R.pars[i],0)}</td></tr>
        ${R.players.map(q=>`<tr><td class="nm">${esc(q.name)}</td>${idx.map(i=>`<td><span class="sc ${cls(q.score[i],R.pars[i])}">${q.score[i]??''}</span></td>`).join('')}<td class="sub">${roundTotals(R,q,a,a+9).s||''}</td></tr>`).join('')}`}).join('')}</table></div>
        <button class="btn ghost sm danger" data-hdel="${k}" style="margin-top:6px">${ic('x',14)} 刪除這筆</button>`:''}</div>`}).join('')}</div>`;
}
function bindHistory(){
  document.querySelectorAll('[data-hr]').forEach(b=>b.onclick=()=>{openRound=openRound===+b.dataset.hr?null:+b.dataset.hr;render()});
  document.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>confirmBox('刪除這筆成績？',()=>{ROUNDS.splice(+b.dataset.hdel,1);saveRounds();openRound=null;render()}));
}
function renderCard(){
  if(!S){$('#app').innerHTML=historyHTML();bindHistory();return}
  const nn=i=>S.nines?nineLabel(S.nines[i]):(i?'後九':'前九');
  const segs=S.holes==18?[[0,9,nn(0)],[9,18,nn(1)]]:[[0,9,nn(0)]];
  let html='';
  segs.forEach(([a,b,nm])=>{
    const idx=[...Array(b-a).keys()].map(k=>k+a);
    html+=`<div class="card"><b>${nm}</b><div class="tablewrap"><table>
      <tr><th class="nm">洞</th>${idx.map(i=>`<th>${hs(i)}</th>`).join('')}<th>計</th></tr>
      <tr><td class="nm">Par</td>${idx.map(i=>`<td>${S.pars[i]}</td>`).join('')}<td class="sub">${idx.reduce((s,i)=>s+S.pars[i],0)}</td></tr>
      ${S.players.map(p=>{const t=totals(p,a,b);return `<tr><td class="nm">${esc(p.name)}</td>${idx.map(i=>`<td><span class="sc ${cls(p.score[i],S.pars[i])}">${p.score[i]??''}</span></td>`).join('')}<td class="sub">${t.played?t.s:''}</td></tr>`}).join('')}
    </table></div></div>`;
  });
  html+=`<div class="card"><b>總成績</b>${S.players.map(p=>{const t=totals(p);
    return `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${esc(p.name)}</span><span><b style="font-size:20px">${t.played?t.s:'—'}</b> ${t.played?'（'+vsPar(t.diff)+'，'+t.played+' 洞）':''}</span></div>`}).join('')}
    <button class="btn ghost" id="copy">複製成績文字</button><div class="copied" id="cp"></div>
    <div class="hint">○ 博蒂　◎ 老鷹　□ 柏忌　▣ 雙柏忌以上</div></div>`;
  $('#app').innerHTML=html+statsHTML()+`<button class="btn fin" id="cardFin" style="margin:4px 0 14px">${ic('check',20)} 完成並儲存這一場</button>`+historyHTML();

// ---------- 電子桿弟 ----------
const CD={dist:'',wind:0,elev:0,lie:'fw',brg:null,from:null,to:null,hz:[],elevState:null};
const WIND=[[-2,'強逆風',0.12],[-1,'逆風',0.06],[0,'無風',0],[1,'順風',-0.04],[2,'強順風',-0.08]];
const LIE=[['tee','發球台',0],['fw','球道',0],['rough','長草',0.05],['sand','沙坑',0.10]];
const HZN={water:'水池',sand:'沙坑'};
// 球桿的左右偏差傾向（正數＝偏右）
function cTend(c){const s=c.shots.slice(-20).filter(x=>x.lat!=null);if(s.length<3)return null;
  return{n:s.length,avg:Math.round(s.reduce((a,x)=>a+x.lat,0)/s.length)}}
function caddieCalc(){
  const d=+CD.dist;if(!d)return null;const u=BAG.unit;
  const w=WIND.find(x=>x[0]===CD.wind),l=LIE.find(x=>x[0]===CD.lie);
  const wAdj=Math.round(d*w[2]),eAdj=Math.round(+CD.elev||0),afterWE=d+wAdj+eAdj,lAdj=Math.round(afterWE*l[2]);
  // 氣溫：以 21°C 為基準，每低 1°C 多約 0.24%（天冷球飛得短）
  const T=W.d?W.d.temperature_2m:null,tAdj=T!=null?Math.round((21-T)*0.0024*(afterWE+lAdj)):0;
  const plays=afterWE+lAdj+tAdj,rr=plays/d;
  const list=BAG.clubs.map(c=>({c,avg:cstat(c).avg,n:cstat(c).n,tend:cTend(c)})).filter(x=>x.avg).sort((a,b)=>a.avg-b.avg);
  const base={plays,wAdj,eAdj,lAdj,tAdj,T,w,l};
  if(!list.length)return{...base,none:true};
  let i=list.findIndex(x=>x.avg>=plays-3);
  let note='';
  if(i<0){i=list.length-1;note=`距離超過你最遠的一桿（${list[i].avg} ${u}），建議分兩桿打，先放到舒服的距離。`}
  else{const gap=list[i].avg-plays;
    if(gap>12&&i>0)note=`介於兩支桿之間：可以用 ${list[i].c.name} 輕一點揮，或用 ${list[i-1].c.name} 全力打。`;
    else if(gap<=3)note='剛好是這支桿的完整揮桿距離。';
    else note=`比平均短 ${gap} ${u}，可以握短一點或收一點揮。`;
    if(i===0&&plays<list[0].avg-15)note='距離比最短的桿還短，用切球或半揮桿控制距離。';}
  const pick=list[i];
  // 障礙物：在擊球線上的（左右 12 公尺內）看能不能越過；在旁邊的配合失誤傾向提醒
  const adv=[];let layup=null;const tend=pick.tend;
  (CD.hz||[]).forEach(z=>{
    const zt=toU(z.to),zc=toU(z.carry),pt=zt*rr,pc=zc*rr,nm=HZN[z.t],reach=pick.avg;
    if(z.lat<=12){
      if(reach<pt-8){if(pt-reach<40)adv.push({lv:'ok',t:`${nm}在 ${zt} ${u}，${pick.c.name} 打不到，不用擔心`})}
      else if(reach>pc+8)adv.push({lv:'ok',t:`可以越過${nm}（要飛 ${zc} ${u}${z.pt?'':'（約）'}，${pick.c.name} 平均 ${reach}）`});
      else{
        adv.push({lv:'warn',t:`${pick.c.name} 很可能落在${nm}裡（到 ${zt}／過 ${zc} ${u}）`});
        const lay=[...list].reverse().find(x=>x.avg<=pt-10),over=list.find(x=>x.avg>=pc+10);
        if(lay&&!layup){layup=lay;adv.push({lv:'tip',t:`建議改用 <b>${esc(lay.c.name)}</b> 放在${nm}前，剩下約 ${Math.max(0,Math.round(d-lay.avg/rr))} ${u}`})}
        if(over&&over!==pick)adv.push({lv:'tip',t:`或用 ${esc(over.c.name)} 確定越過（平均 ${over.avg}）`});
      }
    }else if(z.lat<=35&&pick.avg>=pt-15&&pick.avg<=pc+15){
      const side=z.side==='right'?'右':'左',same=tend&&Math.abs(tend.avg)>=4&&((tend.avg>0)===(z.side==='right'));
      adv.push({lv:same?'warn':'info',t:`${side}邊 ${toU(z.lat)} ${u} 外有${nm}（${zt}–${zc} ${u}）${same?`，你的 ${pick.c.name} 常偏${side}，建議瞄${side==='右'?'左':'右'}邊一點`:''}`});
    }
  });
  let aim='';
  if(tend&&Math.abs(tend.avg)>=4)aim=`你的 ${pick.c.name} 平均偏${tend.avg>0?'右':'左'} ${Math.abs(tend.avg)} ${u}（${tend.n} 次紀錄），可以往${tend.avg>0?'左':'右'}瞄一點。`;
  return{...base,pick,up:list[i+1],down:list[i-1],note,adv,aim,layup};
}
const WIC={'-2':['arrow',180,2,'強逆'],'-1':['arrow',180,1,'逆'],'0':['target',0,1,'無'],'1':['arrow',0,1,'順'],'2':['arrow',0,2,'強順']};
const LIC={tee:['tee','開球'],fw:['fair','球道'],rough:['grass','長草'],sand:['sand','沙坑']};
const windIc=(lv,sz)=>{const[n,r,k]=WIC[lv];return Array(k).fill(ic(n,sz||18,`style="transform:rotate(${r}deg)"`)).join('')};
function caddieResHTML(){
  const r=caddieCalc(),u=BAG.unit,sg=n=>(n>0?'+':'')+n;
  if(!r)return '';
  const chips=[r.wAdj?`<span>${windIc(CD.wind,14)} ${sg(r.wAdj)}</span>`:'',r.eAdj?`<span>${ic('hill',14)} ${sg(r.eAdj)}</span>`:'',

  const advHTML=r.adv&&r.adv.length?`<div class="advbox">${r.adv.map(a=>`<div class="adv ${a.lv}">${a.lv==='warn'?'⚠️':a.lv==='tip'?'👉':a.lv==='ok'?'✅':'ℹ️'} ${a.t}</div>`).join('')}</div>`:'';
  return `<div class="card" style="text-align:center">
    <div class="cplays"><b>${r.plays}</b><span>${u}</span></div>
    <div class="cchips"><span>${ic('flag',14)} ${CD.dist}</span>${chips}</div>

    <div class="cpick">${ic('club',26)}<div><b>${esc(r.pick.c.name)}</b><small>${r.pick.avg} ${u}${r.pick.n?`・${r.pick.n} 次`:'・預估'}</small></div></div>
    <div style="font-size:14px;margin-top:6px">${r.note}</div>
    ${r.aim?`<div style="margin-top:6px;font-size:14px">🎯 ${r.aim}</div>`:''}
    ${advHTML}
    <div class="row" style="margin-top:10px;font-size:13px;color:var(--mute);justify-content:space-around">
      ${r.down?`<span>${ic('minus',12)} ${esc(r.down.c.name)} ${r.down.avg}</span>`:''}${r.up?`<span>${ic('plus',12)} ${esc(r.up.c.name)} ${r.up.avg}</span>`:''}</div>
    <button class="btn ghost" data-rec="${r.pick.c.id}">${ic('ruler',18)} 記錄距離</button>`}
  </div>`;
}

// 高低差：用地形資料（Open-Meteo，約 90 公尺解析度）
const ELEV={};
async function fetchElev(a,b){

    const js=await r.json();const e=js.elevation;
    if(e&&e.length===2&&CD.elevState==='loading'){const dm=e[1]-e[0];CD.elev=Math.round(BAG.unit==='公尺'?dm:dm/0.9144);CD.elevState='auto'}
    else if(CD.elevState==='loading')CD.elevState='fail';

  if(view==='caddie')render();
}

const gpsKey=()=>'golf-gps:'+((S&&S.course)||'未命名球場');

const G={on:false,pos:null,acc:null,err:null,id:null,lock:null,last:0};

function distM(a,b){const R=6371000,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const toU=m=>Math.round(BAG.unit==='公尺'?m:m/0.9144);

// ---------- 幾何、球場資料（OpenStreetMap）、天氣 ----------
const RAD=Math.PI/180;
function xy(p,o){return{x:(p.lon-o.lon)*Math.cos(o.lat*RAD)*111320,y:(p.lat-o.lat)*110540}}
function inPoly(P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a.y>0)!==(b.y>0)&&0<(b.x-a.x)*(0-a.y)/(b.y-a.y)+a.x)c=!c}return c}

  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],dx=b.x-a.x,dy=b.y-a.y;
    const t=Math.max(0,Math.min(1,-(a.x*dx+a.y*dy)/((dx*dx+dy*dy)||1)));m=Math.min(m,Math.hypot(a.x+t*dx,a.y+t*dy))}return m}
function polyFar(pts,o){return Math.max(...pts.map(p=>{const q=xy(p,o);return Math.hypot(q.x,q.y)}))}
function centroid(pts){if(pts.length>2&&pts[0].lat===pts[pts.length-1].lat&&pts[0].lon===pts[pts.length-1].lon)pts=pts.slice(0,-1);const n=pts.length;return{lat:pts.reduce((s,p)=>s+p.lat,0)/n,lon:pts.reduce((s,p)=>s+p.lon,0)/n}}

const angDiff=(a,b)=>((a-b+540)%360)-180;
const dirName=d=>['北','東北','東','東南','南','西南','西','西北'][Math.round(d/45)%8];

// OpenStreetMap 球場資料
const osmKey=()=>'golf-osm:'+((S&&S.course)||'未命名球場');
let OSM=null;const OSMST={busy:false,tried:{},msg:''};
function loadOSMCache(){try{OSM=JSON.parse(localStorage.getItem(osmKey()))}catch(e){OSM=null}}
async function fetchOSM(c,manual){
  if(OSMST.busy||!S)return;OSMST.busy=true;OSMST.tried[S.course]=1;OSMST.msg='正在載入球場資料⋯';drawSatInfo();
  const a=`(around:1800,${c.lat.toFixed(5)},${c.lon.toFixed(5)})`;
  const q=`[out:json][timeout:25];(way["golf"="green"]${a};way["golf"="bunker"]${a};way["golf"~"water_hazard"]${a};way["natural"="water"]${a};way["golf"="hole"]${a};);out geom;`;
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    const js=await r.json();const o={t:Date.now(),greens:[],hz:[],holes:{}};
    js.elements.forEach(e=>{if(!e.geometry||e.geometry.length<2)return;const pts=e.geometry.map(g=>({lat:+g.lat.toFixed(6),lon:+g.lon.toFixed(6)}));const tg=e.tags||{};
      if(tg.golf==='green')o.greens.push({pts});
      else if(tg.golf==='bunker')o.hz.push({t:'sand',pts});
      else if((tg.golf||'').includes('water')||tg.natural==='water')o.hz.push({t:'water',pts});
      else if(tg.golf==='hole'&&tg.ref)o.holes[tg.ref]={pts,par:+tg.par||null}});
    OSM=o;try{localStorage.setItem(osmKey(),JSON.stringify(o))}catch(e){}
    const ns=o.hz.filter(h=>h.t==='sand').length,nw=o.hz.length-ns;
    OSMST.msg=(o.greens.length||o.hz.length)?`已從公開地圖資料載入：${o.greens.length} 個果嶺、${ns} 個沙坑、${nw} 個水池${Object.keys(o.holes).length?`、${Object.keys(o.holes).length} 洞的路線`:''}。`:
      '這個球場在公開地圖資料裡沒有詳細標示，請在記分頁的衛星圖上手動標記果嶺和障礙物。';
  }catch(e){OSMST.msg=manual?'載入失敗，請確認手機有網路，稍後再試。':''}
  OSMST.busy=false;drawOSMLayer();drawGPS();drawSatInfo();
}
// 這洞的果嶺：手動標記優先，其次用公開地圖資料的果嶺形狀
function greenOf(h){
  const m=GREENS[hk(h)]||{};let poly=null;
  if(OSM&&OSM.greens.length){const hole=OSM.holes[hk(h)];const ref=hole?hole.pts[hole.pts.length-1]:(m.c||m.f||m.b);
    if(ref){let best=null,bd=1e9;OSM.greens.forEach(g=>{const d=distM(centroid(g.pts),ref);if(d<bd){bd=d;best=g}});if(best&&bd<(hole?90:45))poly=best.pts}}
  const c=m.c||(poly?centroid(poly):null);
  return{m,poly,c,any:!!(c||m.f||m.b)};
}
function greenDists(h){
  if(!G.pos)return null;const g=greenOf(h),p=G.pos,o={};
  if(g.c)o.c=distM(p,g.c);
  if(g.m.f)o.f=distM(p,g.m.f);else if(g.poly)o.f=polyNear(g.poly,p);else if(o.c!=null){o.f=Math.max(0,o.c-13.7);o.fEst=true}
  if(g.m.b)o.b=distM(p,g.m.b);else if(g.poly)o.b=polyFar(g.poly,p);
  return(o.c!=null||o.f!=null||o.b!=null)?o:null;
}
function holeBearing(h,from){
  const g=greenOf(h),p=from||G.pos;
  if(p&&g.c)return bearing(p,g.c);
  const hole=OSM&&OSM.holes[hk(h)];if(hole)return bearing(hole.pts[0],hole.pts[hole.pts.length-1]);
  return null;
}
function hazards(){return[...(OSM?OSM.hz:[]),...((GREENS.hz||[]).map(p=>({t:p.t,pts:[{lat:p.lat,lon:p.lon}]})))]}
// 前方最近的沙坑、水池：到（碰到邊緣）與過（越過）的距離
function hazAhead(h){
  if(!G.pos)return[];const p=G.pos,brg=holeBearing(h),gd=greenDists(h),gmax=gd?(gd.b||gd.c||gd.f)+25:400;const best={};
  hazards().forEach(z=>{const cen=z.pts.length>2?centroid(z.pts):z.pts[0];const dc=distM(p,cen);if(dc>450)return;
    if(brg!=null){if(Math.abs(angDiff(bearing(p,cen),brg))>40)return;if(dc>gmax)return}
    const to=z.pts.length>2?polyNear(z.pts,p):dc,carry=z.pts.length>2?polyFar(z.pts,p):dc;
    if(carry<8)return;
    if(!best[z.t]||to<best[z.t].to)best[z.t]={t:z.t,to,carry,pt:z.pts.length>2};
  });
  return['water','sand'].map(t=>best[t]).filter(Boolean);
}

// 天氣（Open-Meteo）
const W={d:null,t:0,busy:false};
async function loadWeather(p){
  if(!p||W.busy||Date.now()-W.t<600000||Date.now()-(W.fail||0)<60000)return;W.busy=true;
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat.toFixed(3)}&longitude=${p.lon.toFixed(3)}&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=ms&timezone=auto`);
    const js=await r.json();if(js.current){W.d=js.current;W.t=Date.now()}else W.fail=Date.now()}catch(e){W.fail=Date.now()}
  W.busy=false;drawGPS();if(view==='caddie')drawCaddieWind();
}
// 這一桿的逆順風與側風（m/s）
function windFor(brg){
  if(!W.d||brg==null)return null;const s=W.d.wind_speed_10m,d=angDiff(W.d.wind_direction_10m,brg)*RAD;
  const head=s*Math.cos(d),cross=s*Math.sin(d);

  return`${Math.abs(w.head)<0.5?'幾乎沒有逆順風':(w.head>0?`逆風 ${a}`:`順風 ${a}`)+' m/s'}${Math.abs(w.cross)>=1?`、${w.cross>0?'右往左':'左往右'}側風 ${c} m/s`:''}`}

  return`<svg viewBox="-34 -34 68 68" width="68" height="68" aria-label="方向與風向">
    <circle r="31" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.35)"/>
    <text y="-21" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">N</text>
    ${brg!=null?`<g transform="rotate(${brg.toFixed(0)})"><line y1="6" y2="-22" stroke="#9be37a" stroke-width="3.5" stroke-linecap="round"/><path d="M0 -29 l-6 9 h12z" fill="#9be37a"/></g>`:''}
    ${wd!=null?`<g transform="rotate(${(wd+180)%360})"><line y1="20" y2="-16" stroke="#6cc3ff" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M0 -22 l-5 8 h10z" fill="#6cc3ff"/></g>`:''}
  </svg>`;
}
// 沿著擊球方向的障礙物：到／過（沿線距離）與離擊球線的左右距離
function hazAlong(p,brg,maxM){
  const out=[],b=brg*RAD,ux=Math.sin(b),uy=Math.cos(b);
  hazards().forEach(z=>{const isPoly=z.pts.length>2,cen=isPoly?centroid(z.pts):z.pts[0];if(distM(p,cen)>maxM+120)return;
    if(Math.abs(angDiff(bearing(p,cen),brg))>50)return;
    const P=(isPoly?z.pts:z.pts).map(q=>{const v=xy(q,p);return{al:v.x*ux+v.y*uy,la:v.x*uy-v.y*ux}});
    let to=Math.min(...P.map(q=>q.al)),carry=Math.max(...P.map(q=>q.al));if(!isPoly)carry=to+12;

function askCaddie(dM,brg,toPt){

// 站著不動最多 5 秒，把多次 GPS 讀數取平均（訊號好時 3 秒就完成）
function avgPos(title,done){
  if(!G.pos)return;
  G.samp=[{...G.pos,acc:G.acc||10}];const t0=Date.now();let stop=false;
  $('#modalBody').innerHTML=`<div style="text-align:center"><b>📍 ${title}</b><div style="font-size:14px;color:var(--mute);margin:6px 0">請站著不動，正在取平均位置</div>
    <div id="avgN" style="font-size:44px;font-weight:800;color:var(--g)">5</div>
    <div style="height:8px;background:#e7e3d6;border-radius:4px;overflow:hidden"><div id="avgBar" style="height:100%;width:0;background:var(--g2);transition:width .25s linear"></div></div>
    <div id="avgInfo" style="font-size:12px;color:var(--mute);margin-top:6px">已取得 1 次讀數</div></div>
    <div class="row"><button class="btn ghost" id="mNo">取消</button><button class="btn" id="avgNow">現在就用</button></div>`;
  $('#modal').classList.add('show');
  const finish=ok=>{if(stop)return;stop=true;clearInterval(iv);const sm=G.samp;G.samp=null;$('#modal').classList.remove('show');if(!ok)return;
    const best=Math.min(...sm.map(x=>x.acc)),use=sm.filter(x=>x.acc<=Math.max(15,best*2));
    let w=0,la=0,lo=0;use.forEach(x=>{const k=1/Math.max(x.acc,1)**2;w+=k;la+=x.lat*k;lo+=x.lon*k});
    done({lat:la/w,lon:lo/w},{n:use.length,acc:Math.max(1,Math.round(best/Math.sqrt(use.length)))})};
  const iv=setInterval(()=>{const t=(Date.now()-t0)/1000,sm=G.samp||[];
    const el=document.getElementById('avgN');if(!el)return;
    el.textContent=Math.max(0,Math.ceil(5-t));$('#avgBar').style.width=Math.min(100,t/5*100)+'%';
    $('#avgInfo').textContent=`已取得 ${sm.length} 次讀數`;
    if(t>=5||(t>=3&&sm.length>=3&&sm.every(x=>x.acc<=6)))finish(true)},250);
  $('#mNo').onclick=()=>finish(false);$('#avgNow').onclick=()=>finish(true);
}

    if(SHOT.aim!=null&&m>20){const df=angDiff(bearing(SHOT.start,p),SHOT.aim);if(Math.abs(df)<45)lat=Math.round(m*Math.sin(df*RAD))}

    avgToast(`${ic('club',20)} <b>${esc(c?c.name:'')}</b><div style="font-size:40px;font-weight:800;color:var(--g)">${m} <span style="font-size:16px">${u}</span></div><div style="font-size:12px;color:var(--mute)">±${toU(info.acc)} ${u}${lat!=null?`・${Math.abs(lat)<2?'直':`偏${lat>0?'右':'左'} ${Math.abs(lat)}`}`:''}</div>`);
    SHOT=null;saveShot();drawGPS()}));
  box.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{if(!G.pos)return;const k=b.dataset.mark;

  on('markClear',()=>confirmBox('要清除這洞的果嶺標記嗎？',()=>{delete GREENS[hk(h)];saveGreens();drawGPS()}));

// ---------- 衛星地圖 ----------
const SAT={map:null,el:null,layer:null,osm:null,mode:'hole',markMode:null,target:null,focusKey:null,results:null};
const MARKNAME={f:'前緣',c:'中心',b:'後緣',sand:'沙坑',water:'水池'};
const ll=p=>[p.lat,p.lon];
function mountSat(slotId,mode,height){
  const slot=document.getElementById(slotId);if(!slot)return;
  if(!window.L){slot.innerHTML='<div class="hint" style="padding:16px;text-align:center">衛星地圖載入失敗。第一次使用需要網路；在 Claude 的預覽頁面裡也無法顯示，請用 liyuan02-maker.github.io/golf 開啟。</div>';return}
  if(!SAT.el){SAT.el=document.createElement('div');SAT.el.className='satmap'}
  SAT.el.style.height=height;slot.appendChild(SAT.el);
  if(!SAT.map){
    SAT.map=L.map(SAT.el,{zoomControl:true,attributionControl:true});
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {maxNativeZoom:19,maxZoom:20,crossOrigin:true,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}).addTo(SAT.map);
    SAT.layer=L.layerGroup().addTo(SAT.map);
    SAT.map.on('click',onSatClick);
    SAT.map.setView([23.7,121],7);
  }
  SAT.mode=mode;
  setTimeout(()=>{SAT.map.invalidateSize();focusSat();drawSat();drawSatInfo()},0);
}
function focusSat(force){
  if(!SAT.map||!S)return;
  const key=SAT.mode+':'+S.course+':'+(SAT.mode==='hole'?S.cur:'');
  if(!force&&key===SAT.focusKey)return;
  SAT.focusKey=key;SAT.target=null;SAT.markMode=null;
  if(SAT.mode==='hole'){
    const go=greenOf(S.cur),g=go.m,pts=[g.f,go.c,g.b].filter(Boolean);
    if(pts.length){const b=pts.map(ll);if(G.pos&&distM(G.pos,pts[0])<700)b.push(ll(G.pos));
      b.length>1?SAT.map.fitBounds(b,{padding:[40,40],maxZoom:18}):SAT.map.setView(b[0],17);return}
  }else{
    const cs=[];for(let i=0;i<S.holes;i++){const go=greenOf(i);if(go.c)cs.push(ll(go.c))}
    if(cs.length>1){SAT.map.fitBounds(cs,{padding:[30,30],maxZoom:17});return}
  }
  if(G.pos)SAT.map.setView(ll(G.pos),17);
  else if(GREENS.center)SAT.map.setView(ll(GREENS.center),16);
}
function pin(txt,cls){return L.divIcon({className:'',html:`<div class="pin ${cls||''}">${txt}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}
function tip(layer,txt){layer.bindTooltip(txt,{permanent:true,direction:'center',className:'dist-tip'})}
const blank=()=>L.divIcon({className:'',html:''});
function midTip(a,b,txt){tip(L.marker([(a.lat+b.lat)/2,(a.lon+b.lon)/2],{icon:blank(),interactive:false}).addTo(SAT.layer),txt)}
// 球場資料（果嶺、沙坑、水池）畫在衛星圖上
function drawOSMLayer(){
  if(!SAT.map)return;
  if(!SAT.osm)SAT.osm=L.layerGroup().addTo(SAT.map);
  SAT.osm.clearLayers();
  if(OSM){
    OSM.greens.forEach(g=>L.polygon(g.pts.map(ll),{color:'#b8f28f',weight:1.5,fillOpacity:.12,interactive:false}).addTo(SAT.osm));
    OSM.hz.forEach(z=>L.polygon(z.pts.map(ll),{color:z.t==='water'?'#3fa9f5':'#f3d36b',weight:1.5,fillOpacity:.3,interactive:false}).addTo(SAT.osm));
  }
  (GREENS.hz||[]).forEach((p,i)=>{const m=L.marker(ll(p),{icon:pin(p.t==='water'?'💧':'⛱','hz')}).addTo(SAT.osm);
    m.on('click',()=>confirmBox(`要刪除這個${p.t==='water'?'水池':'沙坑'}標記嗎？`,()=>{GREENS.hz.splice(i,1);saveGreens();drawOSMLayer();drawGPS()}))});
}
function drawSat(){
  if(!SAT.map||!S)return;
  if(!SAT.osm)drawOSMLayer();
  if(G.pos&&SAT.map.getZoom()<10)SAT.map.setView(ll(G.pos),17);
  SAT.layer.clearLayers();const u=BAG.unit;
  if(SAT.mode==='hole'){
    const go=greenOf(S.cur),g=go.m;
    const front=G.pos&&greenDists(S.cur);
    if(G.pos&&go.c&&!SAT.target){L.polyline([ll(G.pos),ll(go.c)],{color:'#fff',weight:2,dashArray:'6 6',interactive:false}).addTo(SAT.layer);
      midTip(G.pos,go.c,front&&front.f!=null?`前緣 ${(front.fEst?'≈':'')+toU(front.f)} ${u}`:`${toU(distM(G.pos,go.c))} ${u}`)}
    if(SAT.target){const t=SAT.target;
      if(G.pos){L.polyline([ll(G.pos),ll(t)],{color:'#ffd84d',weight:3,interactive:false}).addTo(SAT.layer);midTip(G.pos,t,`${toU(distM(G.pos,t))} ${u}`)}
      if(go.c){L.polyline([ll(t),ll(go.c)],{color:'#fff',weight:2,dashArray:'6 6',interactive:false}).addTo(SAT.layer);midTip(t,go.c,`${toU(distM(t,go.c))} ${u}`)}
      L.marker(ll(t),{icon:pin('◎','t'),interactive:false}).addTo(SAT.layer);
    }
    if(go.poly)L.polygon(go.poly.map(ll),{color:'#fff',weight:2,fillOpacity:0,interactive:false}).addTo(SAT.layer);
    ['f','b'].forEach(k=>{if(g[k])L.marker(ll(g[k]),{icon:pin(MARKNAME[k][0]),interactive:false}).addTo(SAT.layer)});
    if(go.c)L.marker(ll(go.c),{icon:pin('⛳','c'),interactive:false}).addTo(SAT.layer);
  }else{
    for(let i=0;i<S.holes;i++){const go=greenOf(i);if(go.c){const m=L.marker(ll(go.c),{icon:pin(hs(i),'c')}).addTo(SAT.layer);
      m.on('click',()=>{S.cur=i;save();view='play';render();window.scrollTo(0,0)})}}
  }
  if(G.pos){if(G.acc)L.circle(ll(G.pos),{radius:G.acc,color:'#4da3ff',weight:1,fillOpacity:.15,interactive:false}).addTo(SAT.layer);
    L.circleMarker(ll(G.pos),{radius:8,color:'#fff',weight:3,fillColor:'#1e88ff',fillOpacity:1,interactive:false}).addTo(SAT.layer)}
}
function onSatClick(e){
  if(!S)return;const p={lat:e.latlng.lat,lon:e.latlng.lng};
  if(SAT.mode==='hole'&&SAT.markMode){

}

      ${OSMST.msg?`<div class="hint">${OSMST.msg}</div>`:''}

// ---------- 開場：先選「下場打球」或「去練習場」 ----------
// 下場流程：選球場 → 前九／後九打哪個球道 → 發球台 → 開始（預設只記自己）
const START={step:'home',course:null,near:null,nearBusy:false,nearErr:false,front:'N',back:'N'};
let COURSES=(()=>{try{return JSON.parse(localStorage.getItem('golf-courses'))||[]}catch(e){return[]}})();
function rememberCourse(c){COURSES=[{...c,t:Date.now()},...COURSES.filter(x=>x.name!==c.name)].slice(0,10);try{localStorage.setItem('golf-courses',JSON.stringify(COURSES))}catch(e){}}
async function fetchNear(p){
  if(START.nearBusy||START.near)return;START.nearBusy=true;drawNear();
  const a=`(around:25000,${p.lat.toFixed(4)},${p.lon.toFixed(4)})`;
  const q=`[out:json][timeout:20];(way["leisure"="golf_course"]${a};relation["leisure"="golf_course"]${a};);out center tags;`;
  try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    const js=await r.json();const seen={};
    START.near=js.elements.filter(e=>e.center&&e.tags&&(e.tags['name:zh']||e.tags.name)).map(e=>({name:e.tags['name:zh']||e.tags.name,lat:e.center.lat,lon:e.center.lon,d:distM(p,{lat:e.center.lat,lon:e.center.lon})}))
      .sort((a,b)=>a.d-b.d).filter(x=>seen[x.name]?false:(seen[x.name]=1)).slice(0,6);
  }catch(e){START.nearErr=true}
  START.nearBusy=false;drawNear();
}
function drawNear(){
  const el=document.getElementById('stNear');if(!el)return;
  if(START.near&&START.near.length){el.innerHTML=START.near.map((c,i)=>`<button class="btn ghost course" data-near="${i}"><span>${esc(c.name)}</span><small>${c.d<1000?Math.round(c.d)+' 公尺':(c.d/1000).toFixed(1)+' 公里'}</small></button>`).join('');
    el.querySelectorAll('[data-near]').forEach(b=>b.onclick=()=>pickCourse(START.near[+b.dataset.near]));return}
  el.innerHTML=`<div class="hint">${START.near?'附近 25 公里內找不到球場資料，請用上面的搜尋。':START.nearErr?'暫時找不到附近球場，請確認有網路，或用上面的搜尋。':START.nearBusy?'正在找附近的球場⋯':G.err?G.err:'GPS 定位中⋯（請允許使用位置）'}</div>`;

let CNINES=(()=>{try{return JSON.parse(localStorage.getItem('golf-course-nines'))||{}}catch(e){return{}}})();

function setCnt(n){START.cnt=n;START.picks=nineSet(n).slice(0,2);CNINES[START.course.name]=n;try{localStorage.setItem('golf-course-nines',JSON.stringify(CNINES))}catch(e){}}
function pickCourse(c){START.course={name:c.name,lat:c.lat,lon:c.lon};const n=CNINES[c.name]||2;START.cnt=n;START.picks=nineSet(n).slice(0,2);goStep('nines')}
function goStep(s){START.step=s;render();window.scrollTo(0,0)}
const TEES=[['紅','#d64541','#fff'],['白','#ffffff','#222'],['藍','#2f6fd6','#fff']];

      <div style="color:var(--mute);margin-top:-4px">⛳ ${esc(START.course.name)}</div>
      <div class="cntseg">${[[2,'18 洞'],[3,'A B C'],[4,'A B C D']].map(([n,t])=>`<button data-cnt="${n}" class="${START.cnt===n?'on':''}">${t}</button>`).join('')}</div>
      <div class="ninegrid">${set.map(v=>{const k=pk.indexOf(v);return`<button data-nine="${v}" class="${k>=0?'on':''}">${k>=0?`<i>${k+1}</i>`:''}<b>${v==='OUT'?'1–9':v==='IN'?'10–18':v}</b><small>${k===0?'前九':k===1?'後九':''}</small></button>`}).join('')}</div>
      <div class="ninesum">${pk.length?pk.map(nineLabel).join(' → ')+`・${pk.length*9} 洞`:'請點選球道'}</div>
      <button class="btn" id="stNext" style="font-size:18px;padding:16px" ${pk.length?'':'disabled'}>下一步</button>
    </div>`;
    $('#stPrev').onclick=()=>goStep('course');
    document.querySelectorAll('[data-cnt]').forEach(x=>x.onclick=()=>{setCnt(+x.dataset.cnt);render()});
    document.querySelectorAll('[data-nine]').forEach(x=>x.onclick=()=>{const v=x.dataset.nine,k=pk.indexOf(v);
      if(k>=0)pk.splice(k,1);else if(pk.length<2)pk.push(v);else pk[1]=v;render()});
    $('#stNext').onclick=()=>{if(pk.length)goStep('tee')};
    return;
  }
  // ④ 發球台
  if(st==='tee'){
    const lab=START.picks.map(nineLabel).join(' → ');
    $('#app').innerHTML=`<div class="card start">${stepHead(3,'打哪個發球台？')}
      <div style="color:var(--mute);margin-top:-4px">⛳ ${esc(START.course.name)}・${lab}</div>
      ${TEES.map(([t,bg,fg])=>`<button class="teechoice" data-tee="${t}"><span class="dot" style="background:${bg};color:${fg}">●</span><b>${t} tee</b></button>`).join('')}
          </div>`;
    $('#stPrev').onclick=()=>goStep('nines');
    document.querySelectorAll('[data-tee]').forEach(x=>x.onclick=()=>startRound(x.dataset.tee));
    return;
  }
}

function confirmBox(msg,ok){
  $('#modalBody').innerHTML=`<div>${msg}</div><div class="row"><button class="btn ghost" id="mNo">取消</button><button class="btn" id="mYes">確定</button></div>`;
  $('#modal').classList.add('show');
  $('#mNo').onclick=()=>$('#modal').classList.remove('show');
  $('#mYes').onclick=()=>{$('#modal').classList.remove('show');ok()};
}

$('#gear').onclick=()=>{if(!S){START.step='home';view='start'}else view='setup';render();window.scrollTo(0,0)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0)});
render();
// 一進來就自動開啟 GPS（有進行中的球局時）
startGPS();
// 有些手機要使用者點過畫面後才允許保持螢幕亮著
document.addEventListener('click',()=>{if(G.on&&!G.lock)keepAwake()},{passive:true});
if('serviceWorker' in navigator && location.protocol==='https:' && window.top===window.self){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
<script src="range.js"></script>
</body>
</html>
