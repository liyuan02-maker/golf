<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高爾夫記分卡</title>
<meta name="theme-color" content="#1f5e3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="高爾夫">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{--g:#1f5e3b;--g2:#2e7d4f;--bg:#f4f1e8;--card:#fff;--ink:#1d2a22;--mute:#6b7a70;--red:#c0392b;--blue:#1e6fb8;--gold:#c9a227}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(80px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{background:var(--g);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;font-weight:600}
header small{opacity:.8}
main{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:11px;font-size:16px;border:1px solid #d6d2c4;border-radius:10px;background:#fff}
.row{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;background:var(--g2);color:#fff;width:100%;margin-top:12px}
.btn.ghost{background:#e7e3d6;color:var(--ink)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:12px 0;font-size:14px;color:var(--mute)}
nav button.on{color:var(--g);font-weight:700}
.holebar{display:flex;align-items:center;justify-content:space-between}
.holebar .num{font-size:34px;font-weight:800;color:var(--g)}
.holebar .meta{text-align:center;color:var(--mute);font-size:14px}
.arrow{width:52px;height:52px;border-radius:50%;border:0;background:#e7e3d6;font-size:24px}
.parsel{display:flex;gap:6px;margin-top:8px}
.parsel button{flex:1;padding:8px;border-radius:10px;border:1px solid #d6d2c4;background:#fff;font-size:15px}
.parsel button.on{background:var(--g);color:#fff;border-color:var(--g)}
.player{border-top:1px solid #eee;padding-top:12px;margin-top:12px}
.player:first-child{border:0;margin:0;padding:0}
.pname{font-weight:700;display:flex;justify-content:space-between}
.stepper{display:flex;align-items:center;gap:10px;margin-top:8px}
.stepper .lbl{width:44px;color:var(--mute);font-size:14px}
.stepper button{width:48px;height:48px;border-radius:12px;border:0;background:#e7e3d6;font-size:24px;font-weight:700}
.stepper .val{flex:1;text-align:center;font-size:30px;font-weight:800}
.toggles{display:flex;gap:6px;margin-top:10px}
.toggles button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid #d6d2c4;background:#fff;font-size:13px}
.toggles button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;color:#fff}
.t-e{background:var(--gold)}.t-b{background:var(--red)}.t-p{background:var(--g2)}.t-o{background:var(--blue)}.t-d{background:#24476b}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{padding:6px 5px;text-align:center;border-bottom:1px solid #eee;white-space:nowrap}
th{background:#eef0ea;font-weight:600}
td.nm,th.nm{text-align:left;position:sticky;left:0;background:#fff}
th.nm{background:#eef0ea}
td.sub{background:#f7f5ee;font-weight:700}
.sc{display:inline-block;min-width:24px;line-height:22px}
.sc.birdie{border:1.5px solid var(--red);border-radius:50%;color:var(--red)}
.sc.eagle{border:3px double var(--red);border-radius:50%;color:var(--red)}
.sc.bogey{border:1.5px solid var(--blue);color:var(--blue)}
.sc.dbl{border:3px double var(--blue);color:var(--blue)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f7f5ee;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.modal.show{display:flex}
.modal .card{max-width:340px;width:100%}
.copied{color:var(--g2);font-size:13px;text-align:center;margin-top:6px}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
.mapbox{position:relative;border-radius:12px;overflow:hidden;background:#dfe8d6;margin-top:10px}
.mapbox img{width:100%;display:block;max-height:340px;object-fit:contain;background:#222}
.mapbox svg{width:100%;height:220px;display:block}
.mapbtns{display:flex;gap:6px;margin-top:8px}
.mapbtns .btn{margin:0;padding:9px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumb{border-radius:10px;overflow:hidden;background:#dfe8d6;aspect-ratio:3/4;position:relative;border:0;padding:0}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:6px;top:6px;background:rgba(31,94,59,.9);color:#fff;font-size:12px;padding:2px 7px;border-radius:10px}
#viewer{position:fixed;inset:0;background:#000;z-index:10;display:none;overflow:auto;touch-action:pinch-zoom}
#viewer.show{display:block}
.satmap{width:100%;border-radius:12px;overflow:hidden;background:#2b3a2f}
.pin{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #1f5e3b;color:#1f5e3b;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.c{background:#c0392b;border-color:#fff;color:#fff}
.pin.t{background:#ffd84d;border-color:#333;color:#333;font-size:16px}
.dist-tip{background:rgba(0,0,0,.72)!important;color:#fff!important;border:0!important;font-weight:700;font-size:14px;box-shadow:none!important;padding:2px 8px!important}
.dist-tip:before{display:none}
.markbar{background:#fff6d6;border-radius:10px;padding:10px;font-size:14px;display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.hzrow{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:6px;line-height:1.7}
.hzrow b{font-size:17px}
.wxrow{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;margin-top:6px}
.pin.hz{background:#fff;border-color:#333;font-size:14px}
.gps{background:#14352a;color:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.gps .yd{display:flex;justify-content:space-around;text-align:center;margin:6px 0}
.gps .yd b{display:block;font-size:34px;line-height:1.1}
.gps .yd .c b{font-size:48px;color:#9be37a}
.gps .yd span{font-size:12px;opacity:.75}
.gps .btn{background:rgba(255,255,255,.14);color:#fff;margin-top:8px}
.gps .btn.hi{background:#9be37a;color:#14352a}
.gps .acc{font-size:12px;opacity:.75;text-align:center}
.gps .mk{display:flex;gap:6px}.gps .mk .btn{padding:9px 4px;font-size:13px}
#viewer img{width:100%;min-height:100%;object-fit:contain}
#viewer button{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:20px}
</style>
</head>
<body>
<header><div class="row" style="justify-content:space-between"><div><h1 id="title">⛳ 高爾夫記分卡</h1><small id="sub">新增一場球局開始記分</small></div><button id="gear" aria-label="設定" style="border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;width:42px;height:42px;font-size:20px">⚙︎</button></div></header>
<main id="app"></main>
<nav id="nav">
  <button data-v="play">記分</button>
  <button data-v="map">地圖</button>
  <button data-v="caddie">桿弟</button>
  <button data-v="bag">球桿</button>
  <button data-v="card">成績</button>
</nav>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div id="viewer"><button id="vClose">✕</button><img id="vImg" alt=""></div>
<input type="file" id="mapFile" accept="image/*" style="display:none">

<script>
const KEY='golf-round-v1';
const DEFAULT_PARS=[4,4,3,5,4,4,3,4,5, 4,3,5,4,4,4,3,5,4];
let S=load()||null;
let view=S?'play':'setup';

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function newRound(course,names,holes){
  S={course,holes,cur:0,pars:DEFAULT_PARS.slice(0,holes),date:new Date().toLocaleDateString('zh-TW'),
     players:names.map(n=>({name:n,score:Array(holes).fill(null),putts:Array(holes).fill(null),fw:Array(holes).fill(null),pen:Array(holes).fill(0)}))};
  save();
}

// ---------- 球場地圖 ----------
const mapKey=()=> 'golf-maps:'+((S&&S.course)||'未命名球場');
let MAPS={};
function loadMaps(){try{MAPS=JSON.parse(localStorage.getItem(mapKey()))||{}}catch(e){MAPS={}}}
function saveMaps(){try{localStorage.setItem(mapKey(),JSON.stringify(MAPS));return true}catch(e){return false}}
function compress(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
  const m=1100,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',0.72))};img.onerror=rej;img.src=URL.createObjectURL(file)})}
let uploadTarget=null;
function pickMap(target){uploadTarget=target;$('#mapFile').value='';$('#mapFile').click()}
function schematic(par,n){
  const fw=par==3?'':par==4?
    '<path d="M100 300 C95 240 105 170 100 110" stroke="#8cc56b" stroke-width="46" fill="none" stroke-linecap="round"/>':
    '<path d="M100 300 C100 230 70 190 75 150 C80 110 120 100 125 80" stroke="#8cc56b" stroke-width="44" fill="none" stroke-linecap="round"/>';
  const g=par==5?[125,62]:[100,par==3?95:78];
  return `<svg viewBox="0 0 200 330" preserveAspectRatio="xMidYMid meet">
    <rect width="200" height="330" fill="#6fa857"/>
    ${par>3?'<ellipse cx="148" cy="190" rx="16" ry="26" fill="#e9dcae"/><ellipse cx="55" cy="140" rx="12" ry="9" fill="#5b9bd5"/>':'<ellipse cx="62" cy="110" rx="18" ry="12" fill="#5b9bd5"/>'}
    ${fw}
    <ellipse cx="${g[0]}" cy="${g[1]}" rx="30" ry="24" fill="#a6dc7e"/>
    <ellipse cx="${g[0]+30}" cy="${g[1]+8}" rx="10" ry="12" fill="#e9dcae"/>
    <line x1="${g[0]}" y1="${g[1]}" x2="${g[0]}" y2="${g[1]-26}" stroke="#333" stroke-width="2"/>
    <path d="M${g[0]} ${g[1]-26} l14 5 l-14 5z" fill="#c0392b"/>
    <rect x="88" y="296" width="24" height="12" rx="3" fill="#a6dc7e" stroke="#fff"/>
    <text x="10" y="24" font-size="18" font-weight="700" fill="#fff">${n?n+' 洞':''}</text>
    <text x="10" y="44" font-size="13" fill="#fff">Par ${par}</text>
  </svg>`;
}
function holeMapHTML(h,compact){
  const img=MAPS[h+1];
  return `<div class="mapbox">${img?`<img src="${img}" data-view="${h+1}" alt="第 ${h+1} 洞地圖">`:schematic(S.pars[h],h+1)}</div>
    <div class="mapbtns"><button class="btn ghost" data-up="${h+1}">${img?'更換地圖':'📷 上傳這洞的地圖'}</button>
    ${img?`<button class="btn ghost" data-view="${h+1}">全螢幕</button><button class="btn ghost" data-del="${h+1}" style="flex:0 0 64px">刪除</button>`:''}</div>
    ${img||compact?'':'<div class="hint">可以上傳球場的洞示意圖、碼數本的照片或地圖截圖，下次打同一個球場會自動帶出。</div>'}`;
}
function bindMapBtns(){
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>pickMap(b.dataset.up));
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{$('#vImg').src=MAPS[b.dataset.view];$('#viewer').classList.add('show')});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmBox('要刪除這張地圖嗎？',()=>{delete MAPS[b.dataset.del];saveMaps();render()}));
}
function renderMap(){
  const ov=MAPS.overview;
  $('#app').innerHTML=`<div class="card" style="padding:8px"><b style="display:block;padding:6px 4px">🛰 衛星地圖</b><div id="satSlot"></div><div id="satInfo" style="padding:0 4px 4px"></div></div>
  <div class="card"><b>自己上傳的全場地圖</b>
    <div class="mapbox">${ov?`<img src="${ov}" data-view="overview" alt="全場地圖">`:'<div style="padding:40px 16px;text-align:center;color:var(--mute)">還沒有全場地圖</div>'}</div>
    <div class="mapbtns"><button class="btn ghost" data-up="overview">${ov?'更換全場地圖':'📷 上傳全場地圖'}</button>${ov?'<button class="btn ghost" data-view="overview">全螢幕</button><button class="btn ghost" data-del="overview" style="flex:0 0 64px">刪除</button>':''}</div></div>
  <div class="card"><b>自己上傳的各洞地圖</b><span style="color:var(--mute);font-size:13px">　點一下就能跳到那一洞</span>
    <div class="thumbs">${S.pars.map((p,i)=>`<button class="thumb" data-go="${i}"><span>${i+1}・Par ${p}</span>${MAPS[i+1]?`<img src="${MAPS[i+1]}" alt="">`:schematic(p,0)}</button>`).join('')}</div>
    <div class="hint">地圖會依球場名稱「${esc(S.course||'未命名球場')}」存在這支手機，下次打同一個球場會自動帶出來。</div></div>`;
  bindMapBtns();
  mountSat('satSlot','course','60vh');
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.go;save();view='play';render();window.scrollTo(0,0)});
}

function vsPar(n){return n===0?'E':(n>0?'+'+n:''+n)}
function totals(p,from=0,to=S.holes){
  let s=0,par=0,played=0;
  for(let i=from;i<to;i++){if(p.score[i]!=null){s+=p.score[i];par+=S.pars[i];played++}}
  return {s,par,diff:s-par,played};
}
function cls(score,par){if(score==null)return'';const d=score-par;return d<=-2?'eagle':d==-1?'birdie':d==1?'bogey':d>=2?'dbl':''}
function label(score,par){
  const d=score-par;
  if(score===1)return['一桿進洞！','t-e'];
  if(d<=-3)return['信天翁','t-e'];if(d==-2)return['老鷹','t-e'];if(d==-1)return['博蒂','t-b'];
  if(d==0)return['平標準桿','t-p'];if(d==1)return['柏忌','t-o'];if(d==2)return['雙柏忌','t-d'];return['+'+d,'t-d'];
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(S){$('#title').textContent='⛳ '+(S.course||'高爾夫記分卡');
    const p=S.players[0],t=totals(p);$('#sub').textContent=S.date+'・'+p.name+' '+(t.played?t.s+'桿 ('+vsPar(t.diff)+')':'尚未記分');}
  if(!S && ['play','map','card'].includes(view)) view='setup';
  if(S){loadMaps();loadGreens();loadOSMCache();if(SAT.map)drawOSMLayer()}
  ({setup:renderSetup,play:renderPlay,map:renderMap,card:renderCard,bag:renderBag,caddie:renderCaddie})[view]();
}

function renderSetup(){
  const names=S?S.players.map(p=>p.name):['我'];
  $('#app').innerHTML=`
  <div class="card">
    <b>新球局</b>
    <label>球場名稱</label><input id="course" placeholder="例如：林口球場" value="${S?esc(S.course):''}">
    <label>洞數</label>
    <select id="holes"><option value="18">18 洞</option><option value="9">9 洞</option></select>
    <label>球員（最多 4 位）</label>
    ${[0,1,2,3].map(i=>`<input class="pn" style="margin-bottom:6px" placeholder="球員 ${i+1}${i?'（選填）':''}" value="${esc(names[i]||'')}">`).join('')}
    <button class="btn" id="start">${S?'開始新球局（清除目前紀錄）':'開始記分'}</button>
    ${S?'<button class="btn ghost" id="back">回到目前球局</button>':''}
    <div class="hint">各洞標準桿可在記分頁面直接調整。紀錄會暫存在這支手機的瀏覽器中。</div>
  </div>`;
  $('#start').onclick=()=>{
    const ns=[...document.querySelectorAll('.pn')].map(i=>i.value.trim()).filter(Boolean);
    if(!ns.length)ns.push('我');
    const go=()=>{newRound($('#course').value.trim(),ns,+$('#holes').value);view='play';render();if(!G.on)startGPS()};
    S?confirmBox('確定要開始新球局？目前的紀錄會被清除。',go):go();
  };
  if(S)$('#back').onclick=()=>{view='play';render()};
}

function renderPlay(){
  const h=S.cur,par=S.pars[h];
  $('#app').innerHTML=`<div id="gpsBox"></div>
  <div class="card" style="padding:8px"><div id="satSlot"></div><div id="satInfo" style="padding:0 4px 4px"></div></div>
  <div class="card">
    <div class="holebar">
      <button class="arrow" id="prev" ${h==0?'disabled style="opacity:.3"':''}>‹</button>
      <div class="meta"><div class="num">第 ${h+1} 洞</div>標準桿 ${par}</div>
      <button class="arrow" id="next">${h==S.holes-1?'✓':'›'}</button>
    </div>
    <div class="parsel">${[3,4,5].map(v=>`<button data-par="${v}" class="${v==par?'on':''}">Par ${v}</button>`).join('')}</div>
    <details ${MAPS[h+1]?'open':''} style="margin-top:10px"><summary style="font-size:14px;color:var(--g);font-weight:600">🖼 自己上傳的洞圖</summary>${holeMapHTML(h)}</details>
    <div class="mapbtns"><button class="btn ghost" id="toCaddie">🧢 問桿弟</button><button class="btn ghost" id="toBag">📏 記錄球桿距離</button></div>
  </div>
  <div class="card">
    ${S.players.map((p,i)=>{
      const sc=p.score[h],t=totals(p);
      const lb=sc!=null?label(sc,par):null;
      return `<div class="player">
        <div class="pname"><span>${esc(p.name)}</span><span style="font-weight:400;color:var(--mute);font-size:14px">總計 ${t.played?t.s+'（'+vsPar(t.diff)+'）':'—'}</span></div>
        <div class="stepper"><span class="lbl">桿數</span><button data-p="${i}" data-f="score" data-d="-1">−</button>
          <span class="val">${sc??'<span style="color:#ccc">'+par+'</span>'}</span>
          <button data-p="${i}" data-f="score" data-d="1">+</button></div>
        <div style="text-align:center;min-height:20px;margin-top:4px">${lb?`<span class="tag ${lb[1]}">${lb[0]}</span>`:''}</div>
        <div class="stepper"><span class="lbl">推桿</span><button data-p="${i}" data-f="putts" data-d="-1">−</button>
          <span class="val" style="font-size:24px">${p.putts[h]??'–'}</span>
          <button data-p="${i}" data-f="putts" data-d="1">+</button></div>
        <div class="toggles">
          ${par>3?`<button data-fw="${i}" data-v="hit" class="${p.fw[h]=='hit'?'on':''}">上球道 ✓</button>
          <button data-fw="${i}" data-v="miss" class="${p.fw[h]=='miss'?'on':''}">未上球道</button>`:''}
          <button data-pen="${i}">罰桿 ${p.pen[h]||0}</button>
        </div>
      </div>`}).join('')}
  </div>`;
  bindMapBtns();

function statsHTML(){
  return '<div style="margin:18px 4px 8px;font-weight:700;color:var(--g)">本場統計</div>'+S.players.map(p=>{
    let putts=0,pn=0,fwh=0,fwn=0,gir=0,girn=0,pen=0,c={e:0,b:0,p:0,o:0,d:0},one=0,three=0;
    for(let i=0;i<S.holes;i++){
      const sc=p.score[i],par=S.pars[i];
      if(p.putts[i]!=null){putts+=p.putts[i];pn++;if(p.putts[i]==1)one++;if(p.putts[i]>=3)three++}
      if(p.fw[i]){fwn++;if(p.fw[i]=='hit')fwh++}
      pen+=p.pen[i]||0;
      if(sc!=null){const d=sc-par;d<=-2?c.e++:d==-1?c.b++:d==0?c.p++:d==1?c.o++:c.d++;
        if(p.putts[i]!=null){girn++;if(sc-p.putts[i]<=par-2)gir++}}
    }
    const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
    const t=totals(p);
    return `<div class="card"><b>${esc(p.name)}</b>
      <div class="stats" style="margin-top:10px">

        <div class="stat"><b>${pct(fwh,fwn)}</b><span>上球道率（${fwh}/${fwn}）</span></div>
        <div class="stat"><b>${pct(gir,girn)}</b><span>標準桿上果嶺率</span></div>
        <div class="stat"><b>${one} / ${three}</b><span>一推 / 三推以上</span></div>
        <div class="stat"><b>${pen}</b><span>罰桿</span></div>
      </div>
      <div class="row" style="justify-content:space-around;margin-top:12px;font-size:13px">
        <span><span class="tag t-e">老鷹+</span> ${c.e}</span><span><span class="tag t-b">博蒂</span> ${c.b}</span>
        <span><span class="tag t-p">Par</span> ${c.p}</span><span><span class="tag t-o">柏忌</span> ${c.o}</span><span><span class="tag t-d">雙+</span> ${c.d}</span>
      </div></div>`}).join('')+'<div class="hint" style="text-align:center">標準桿上果嶺：桿數 − 推桿 ≤ 標準桿 − 2</div>';
}

// ---------- 電子桿弟 ----------
const CD={dist:'',wind:0,elev:0,lie:'fw'};
const WIND=[[-2,'強逆風',0.12],[-1,'逆風',0.06],[0,'無風',0],[1,'順風',-0.04],[2,'強順風',-0.08]];
const LIE=[['tee','發球台',0],['fw','球道',0],['rough','長草',0.05],['sand','沙坑',0.10]];
function caddieCalc(){
  const d=+CD.dist;if(!d)return null;
  const w=WIND.find(x=>x[0]===CD.wind),l=LIE.find(x=>x[0]===CD.lie);
  const wAdj=Math.round(d*w[2]),eAdj=Math.round(+CD.elev||0),afterWE=d+wAdj+eAdj,lAdj=Math.round(afterWE*l[2]);
  const plays=afterWE+lAdj;
  const list=BAG.clubs.map(c=>({c,avg:cstat(c).avg,n:cstat(c).n})).filter(x=>x.avg).sort((a,b)=>a.avg-b.avg);
  if(!list.length)return{plays,wAdj,eAdj,lAdj,w,l,none:true};
  let i=list.findIndex(x=>x.avg>=plays-3);
  let note='';
  if(i<0){i=list.length-1;note=`距離超過你最遠的一桿（${list[i].avg} ${BAG.unit}），建議分兩桿打，先放到舒服的距離。`}
  else{const gap=list[i].avg-plays;
    if(gap>12&&i>0)note=`介於兩支桿之間：可以用 ${list[i].c.name} 輕一點揮，或用 ${list[i-1].c.name} 全力打。`;
    else if(gap<=3)note='剛好是這支桿的完整揮桿距離。';
    else note=`比平均短 ${gap} ${BAG.unit}，可以握短一點或收一點揮。`;
    if(i===0&&plays<list[0].avg-15)note='距離比最短的桿還短，用切球或半揮桿控制距離。';}
  return{plays,wAdj,eAdj,lAdj,w,l,pick:list[i],up:list[i+1],down:list[i-1],note};
}
function caddieResHTML(){
  const r=caddieCalc(),u=BAG.unit,sg=n=>(n>0?'+':'')+n;
  if(!r)return '';
  return `<div class="card" style="text-align:center">
    <div style="color:var(--mute);font-size:14px">實際打起來大約</div>
    <div style="font-size:40px;font-weight:800;color:var(--g)">${r.plays} <span style="font-size:18px">${u}</span></div>
    <div style="font-size:12px;color:var(--mute)">${CD.dist} ${u}${r.wAdj?`・${r.w[1]} ${sg(r.wAdj)}`:''}${r.eAdj?`・高低差 ${sg(r.eAdj)}`:''}${r.lAdj?`・${r.l[1]} ${sg(r.lAdj)}`:''}</div>
    ${r.none?'<div class="hint">球袋裡還沒有球桿距離，先到「球桿」頁設定。</div>':`

    <button class="btn ghost" data-rec="${r.pick.c.id}">打完了，記錄 ${esc(r.pick.c.name)} 的距離</button>`}
  </div>`;
}

  drawCaddieRes();drawCaddieWind();
  $('#cdDist').oninput=e=>{CD.dist=e.target.value;drawCaddieRes()};

// ---------- GPS ----------
const gpsKey=()=>'golf-gps:'+((S&&S.course)||'未命名球場');
let GREENS={};
function loadGreens(){try{GREENS=JSON.parse(localStorage.getItem(gpsKey()))||{}}catch(e){GREENS={}}}
function saveGreens(){try{localStorage.setItem(gpsKey(),JSON.stringify(GREENS))}catch(e){}}
const G={on:false,pos:null,acc:null,err:null,id:null,lock:null,last:0};
let SHOT=(()=>{try{return JSON.parse(localStorage.getItem('golf-shot'))}catch(e){return null}})();
function saveShot(){try{SHOT?localStorage.setItem('golf-shot',JSON.stringify(SHOT)):localStorage.removeItem('golf-shot')}catch(e){}}
function distM(a,b){const R=6371000,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const toU=m=>Math.round(BAG.unit==='公尺'?m:m/0.9144);
function keepAwake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>G.lock=l).catch(()=>{})}catch(e){}}
function startGPS(){
  if(!('geolocation' in navigator)){G.err='這支手機不支援定位';drawGPS();return}
  G.on=true;G.err=null;
  try{G.id=navigator.geolocation.watchPosition(p=>{
      G.pos={lat:p.coords.latitude,lon:p.coords.longitude};G.acc=Math.round(p.coords.accuracy);G.err=null;
      loadWeather(G.pos);if(S&&!OSM&&!OSMST.tried[S.course])fetchOSM(G.pos);
      if(Date.now()-G.last>2500){G.last=Date.now();drawGPS()}},
    e=>{if(e.code!==1&&G.pos){G.err='GPS 訊號不穩，顯示的是最後一次的位置。'}else G.err=e.code===1?'沒有定位權限。請到手機設定允許這個網頁使用位置；在 Claude 的預覽頁面裡無法使用 GPS，請用你自己的網址開啟。':'暫時抓不到 GPS 訊號，請到空曠的地方再試一次。';drawGPS()},
    {enableHighAccuracy:true,maximumAge:2000,timeout:20000})}catch(e){G.err='這個環境不能使用 GPS。'}
  keepAwake();drawGPS();
}
function stopGPS(){try{navigator.geolocation.clearWatch(G.id)}catch(e){}G.on=false;G.pos=null;try{G.lock&&G.lock.release()}catch(e){}G.lock=null;drawGPS()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&G.on)keepAwake()});
// ---------- 幾何、球場資料（OpenStreetMap）、天氣 ----------
const RAD=Math.PI/180;
function xy(p,o){return{x:(p.lon-o.lon)*Math.cos(o.lat*RAD)*111320,y:(p.lat-o.lat)*110540}}
function inPoly(P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a.y>0)!==(b.y>0)&&0<(b.x-a.x)*(0-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function polyNear(pts,o){const P=pts.map(p=>xy(p,o));if(inPoly(P))return 0;let m=1e9;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],dx=b.x-a.x,dy=b.y-a.y;
    const t=Math.max(0,Math.min(1,-(a.x*dx+a.y*dy)/((dx*dx+dy*dy)||1)));m=Math.min(m,Math.hypot(a.x+t*dx,a.y+t*dy))}return m}
function polyFar(pts,o){return Math.max(...pts.map(p=>{const q=xy(p,o);return Math.hypot(q.x,q.y)}))}
function centroid(pts){if(pts.length>2&&pts[0].lat===pts[pts.length-1].lat&&pts[0].lon===pts[pts.length-1].lon)pts=pts.slice(0,-1);const n=pts.length;return{lat:pts.reduce((s,p)=>s+p.lat,0)/n,lon:pts.reduce((s,p)=>s+p.lon,0)/n}}
function bearing(a,b){const y=Math.sin((b.lon-a.lon)*RAD)*Math.cos(b.lat*RAD),x=Math.cos(a.lat*RAD)*Math.sin(b.lat*RAD)-Math.sin(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.cos((b.lon-a.lon)*RAD);return(Math.atan2(y,x)/RAD+360)%360}
const angDiff=(a,b)=>((a-b+540)%360)-180;
const dirName=d=>['北','東北','東','東南','南','西南','西','西北'][Math.round(d/45)%8];

// OpenStreetMap 球場資料
const osmKey=()=>'golf-osm:'+((S&&S.course)||'未命名球場');
let OSM=null;const OSMST={busy:false,tried:{},msg:''};
function loadOSMCache(){try{OSM=JSON.parse(localStorage.getItem(osmKey()))}catch(e){OSM=null}}
async function fetchOSM(c,manual){
  if(OSMST.busy||!S)return;OSMST.busy=true;OSMST.tried[S.course]=1;OSMST.msg='正在載入球場資料⋯';drawSatInfo();
  const a=`(around:1800,${c.lat.toFixed(5)},${c.lon.toFixed(5)})`;
  const q=`[out:json][timeout:25];(way["golf"="green"]${a};way["golf"="bunker"]${a};way["golf"~"water_hazard"]${a};way["natural"="water"]${a};way["golf"="hole"]${a};);out geom;`;
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    const js=await r.json();const o={t:Date.now(),greens:[],hz:[],holes:{}};
    js.elements.forEach(e=>{if(!e.geometry||e.geometry.length<2)return;const pts=e.geometry.map(g=>({lat:+g.lat.toFixed(6),lon:+g.lon.toFixed(6)}));const tg=e.tags||{};
      if(tg.golf==='green')o.greens.push({pts});
      else if(tg.golf==='bunker')o.hz.push({t:'sand',pts});
      else if((tg.golf||'').includes('water')||tg.natural==='water')o.hz.push({t:'water',pts});
      else if(tg.golf==='hole'&&tg.ref)o.holes[tg.ref]={pts,par:+tg.par||null}});
    OSM=o;try{localStorage.setItem(osmKey(),JSON.stringify(o))}catch(e){}
    const ns=o.hz.filter(h=>h.t==='sand').length,nw=o.hz.length-ns;
    OSMST.msg=(o.greens.length||o.hz.length)?`已從公開地圖資料載入：${o.greens.length} 個果嶺、${ns} 個沙坑、${nw} 個水池${Object.keys(o.holes).length?`、${Object.keys(o.holes).length} 洞的路線`:''}。`:
      '這個球場在公開地圖資料裡沒有詳細標示，請在記分頁的衛星圖上手動標記果嶺和障礙物。';
  }catch(e){OSMST.msg=manual?'載入失敗，請確認手機有網路，稍後再試。':''}
  OSMST.busy=false;drawOSMLayer();drawGPS();drawSatInfo();
}
// 這洞的果嶺：手動標記優先，其次用公開地圖資料的果嶺形狀
function greenOf(h){
  const m=GREENS[h+1]||{};let poly=null;
  if(OSM&&OSM.greens.length){const hole=OSM.holes[h+1];const ref=hole?hole.pts[hole.pts.length-1]:(m.c||m.f||m.b);
    if(ref){let best=null,bd=1e9;OSM.greens.forEach(g=>{const d=distM(centroid(g.pts),ref);if(d<bd){bd=d;best=g}});if(best&&bd<(hole?90:45))poly=best.pts}}
  const c=m.c||(poly?centroid(poly):null);
  return{m,poly,c,any:!!(c||m.f||m.b)};
}
function greenDists(h){
  if(!G.pos)return null;const g=greenOf(h),p=G.pos,o={};
  if(g.c)o.c=distM(p,g.c);
  if(g.m.f)o.f=distM(p,g.m.f);else if(g.poly)o.f=polyNear(g.poly,p);else if(o.c!=null){o.f=Math.max(0,o.c-13.7);o.fEst=true}
  if(g.m.b)o.b=distM(p,g.m.b);else if(g.poly)o.b=polyFar(g.poly,p);
  return(o.c!=null||o.f!=null||o.b!=null)?o:null;
}
function holeBearing(h,from){
  const g=greenOf(h),p=from||G.pos;
  if(p&&g.c)return bearing(p,g.c);
  const hole=OSM&&OSM.holes[h+1];if(hole)return bearing(hole.pts[0],hole.pts[hole.pts.length-1]);
  return null;
}
function hazards(){return[...(OSM?OSM.hz:[]),...((GREENS.hz||[]).map(p=>({t:p.t,pts:[{lat:p.lat,lon:p.lon}]})))]}
// 前方最近的沙坑、水池：到（碰到邊緣）與過（越過）的距離
function hazAhead(h){
  if(!G.pos)return[];const p=G.pos,brg=holeBearing(h),gd=greenDists(h),gmax=gd?(gd.b||gd.c||gd.f)+25:400;const best={};
  hazards().forEach(z=>{const cen=z.pts.length>2?centroid(z.pts):z.pts[0];const dc=distM(p,cen);if(dc>450)return;
    if(brg!=null){if(Math.abs(angDiff(bearing(p,cen),brg))>40)return;if(dc>gmax)return}
    const to=z.pts.length>2?polyNear(z.pts,p):dc,carry=z.pts.length>2?polyFar(z.pts,p):dc;
    if(carry<8)return;
    if(!best[z.t]||to<best[z.t].to)best[z.t]={t:z.t,to,carry,pt:z.pts.length>2};
  });
  return['water','sand'].map(t=>best[t]).filter(Boolean);
}

// 天氣（Open-Meteo）
const W={d:null,t:0,busy:false};
async function loadWeather(p){
  if(!p||W.busy||Date.now()-W.t<600000||Date.now()-(W.fail||0)<60000)return;W.busy=true;
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat.toFixed(3)}&longitude=${p.lon.toFixed(3)}&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=ms&timezone=auto`);
    const js=await r.json();if(js.current){W.d=js.current;W.t=Date.now()}else W.fail=Date.now()}catch(e){W.fail=Date.now()}
  W.busy=false;drawGPS();if(view==='caddie')drawCaddieWind();
}
// 這一桿的逆順風與側風（m/s）
function windFor(brg){
  if(!W.d||brg==null)return null;const s=W.d.wind_speed_10m,d=angDiff(W.d.wind_direction_10m,brg)*RAD;
  const head=s*Math.cos(d),cross=s*Math.sin(d);
  const lvl=head>=5?-2:head>=2?-1:head<=-5?2:head<=-2?1:0;
  return{head,cross,lvl};
}
function windText(w){if(!w)return'';const a=Math.abs(w.head).toFixed(1),c=Math.abs(w.cross).toFixed(1);
  return`${Math.abs(w.head)<0.5?'幾乎沒有逆順風':(w.head>0?`逆風 ${a}`:`順風 ${a}`)+' m/s'}${Math.abs(w.cross)>=1?`、${w.cross>0?'右往左':'左往右'}側風 ${c} m/s`:''}`}
function compass(brg){
  const wd=W.d?W.d.wind_direction_10m:null;
  return`<svg viewBox="-34 -34 68 68" width="68" height="68" aria-label="方向與風向">
    <circle r="31" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.35)"/>
    <text y="-21" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">N</text>
    ${brg!=null?`<g transform="rotate(${brg.toFixed(0)})"><line y1="6" y2="-22" stroke="#9be37a" stroke-width="3.5" stroke-linecap="round"/><path d="M0 -29 l-6 9 h12z" fill="#9be37a"/></g>`:''}
    ${wd!=null?`<g transform="rotate(${(wd+180)%360})"><line y1="20" y2="-16" stroke="#6cc3ff" stroke-width="2.5" stroke-dasharray="4 3"/><path d="M0 -22 l-5 8 h10z" fill="#6cc3ff"/></g>`:''}
  </svg>`;
}
function askCaddie(dM,brg){CD.dist=toU(dM);CD.elev=0;const w=windFor(brg);if(w)CD.wind=w.lvl;CD.brg=brg;view='caddie';render();window.scrollTo(0,0)}

function drawGPS(){
  drawSat();drawSatInfo();
  const box=$('#gpsBox');if(!box||!S)return;
  const h=S.cur,u=BAG.unit;
  if(!G.on){box.innerHTML=`<div class="gps"><b>📡 GPS 測距</b><div style="font-size:13px;opacity:.8;margin-top:4px">顯示到果嶺前緣、障礙物的距離，還有風向與方向。</div>${G.err?`<div style="color:#ffb4a8;font-size:13px;margin-top:6px">${G.err}</div>`:''}<button class="btn hi" id="gpsOn">開啟 GPS</button></div>`;$('#gpsOn').onclick=startGPS;return}
  const d=greenDists(h),brg=holeBearing(h);
  let html=`<div class="gps"><div class="row" style="justify-content:space-between"><b>📡 第 ${h+1} 洞${brg!=null?`<span style="font-weight:400;opacity:.85">・往${dirName(brg)} ${Math.round(brg)}°</span>`:''}</b><button class="btn sm" id="gpsOff" style="margin:0;background:rgba(255,255,255,.14);color:#fff">關閉</button></div>`;
  if(G.err)html+=`<div style="color:#ffb4a8;font-size:13px;margin-top:6px">${G.err}</div>`;
  if(!G.pos){if(!G.err)html+=`<div class="acc" style="margin:14px 0">正在定位⋯</div>`}
  else{
    if(d){
      html+=`<div class="yd"><div class="c"><b>${d.f!=null?(d.fEst?'≈':'')+toU(d.f):'—'}</b><span>果嶺前緣${d.fEst?'（估）':''}</span></div><div><b>${d.c!=null?toU(d.c):'—'}</b><span>中心</span></div><div><b>${d.b!=null?toU(d.b):'—'}</b><span>後緣</span></div></div>`;
    }else html+=`<div style="font-size:13px;opacity:.85;margin:10px 0">這洞還沒有果嶺位置。可以在下面的衛星圖上標記，或到「地圖」頁載入球場資料。</div>`;
    // 障礙物
    const hz=hazAhead(h);
    html+=`<div class="hzrow">${hz.length?hz.map(z=>`<div>${z.t==='water'?'💧 水池':'⛱ 沙坑'}　到 <b>${toU(z.to)}</b>${z.pt?`　過 <b>${toU(z.carry)}</b>`:''} ${u}</div>`).join(''):`<div style="opacity:.7">前方 ${toU(450)} ${u} 內沒有已知的沙坑或水池</div>`}</div>`;
    // 風與方向
    const w=windFor(brg);
    html+=`<div class="wxrow">${compass(brg)}<div style="flex:1;font-size:13px;line-height:1.5">${W.d?
      `🌬 <b>${dirName(W.d.wind_direction_10m)}風 ${W.d.wind_speed_10m.toFixed(1)} m/s</b>（陣風 ${W.d.wind_gusts_10m.toFixed(0)}）・${Math.round(W.d.temperature_2m)}°C<br>${w?`這一桿：<b>${windText(w)}</b>`:'標記果嶺後可以算出這一桿的逆順風'}`:
      (W.busy?'正在取得天氣⋯':'天氣資料需要網路')}<div style="opacity:.6;font-size:11px">綠箭頭＝往果嶺方向　藍虛線＝風吹的方向</div></div></div>`;
    if(d&&(d.c!=null||d.f!=null))html+=`<button class="btn" id="gpsAsk">🧢 用${d.c!=null?'中心 '+toU(d.c):'前緣 '+toU(d.f)} ${u} 問桿弟${w?'（已帶入風向）':''}</button>`;
    html+=`<div class="acc">GPS 誤差約 ±${toU(G.acc)} ${u}${G.acc>15?'（訊號較弱，距離僅供參考）':''}</div>`;
    if(SHOT){const c=BAG.clubs.find(x=>x.id===SHOT.club);const m=toU(distM(SHOT.start,G.pos));
      html+=`<div style="background:rgba(155,227,122,.15);border-radius:10px;padding:10px;margin-top:10px;text-align:center">正在量 <b>${esc(c?c.name:'球桿')}</b><div style="font-size:36px;font-weight:800;color:#9be37a">${m} <span style="font-size:15px">${u}</span></div>
        <div class="row"><button class="btn" id="shotCancel">取消</button><button class="btn hi" id="shotSave">到球旁了，儲存</button></div></div>`;
    }else html+=`<button class="btn hi" id="shotStart">📏 量這一桿的距離</button>`;
    const g=GREENS[h+1]||{};
    html+=`<details style="margin-top:10px"><summary style="font-size:13px;opacity:.85">📍 站在果嶺上標記位置${g.c?'（已標記）':''}</summary>
      <div style="font-size:12px;opacity:.75;margin:6px 0">站在果嶺的前緣、中心或後緣，按對應的按鈕。</div>
      <div class="mk"><button class="btn" data-mark="f">前緣${g.f?' ✓':''}</button><button class="btn" data-mark="c">中心${g.c?' ✓':''}</button><button class="btn" data-mark="b">後緣${g.b?' ✓':''}</button></div>
      ${g.c||g.f||g.b?'<button class="btn" id="markClear" style="font-size:13px">清除這洞的標記</button>':''}</details>`;
  }
  html+='</div>';
  const det=box.querySelector('details'),wasOpen=det&&det.open;
  box.innerHTML=html;
  if(wasOpen&&box.querySelector('details'))box.querySelector('details').open=true;
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on('gpsOff',stopGPS);
  on('gpsAsk',()=>askCaddie(d.c!=null?d.c:d.f,brg));
  on('shotStart',pickShotClub);
  on('shotCancel',()=>{SHOT=null;saveShot();drawGPS()});
  on('shotSave',()=>{const c=BAG.clubs.find(x=>x.id===SHOT.club);const m=toU(distM(SHOT.start,G.pos));
    if(c&&m>0){c.shots.push({d:m,t:Date.now()});saveBag()}
    $('#modalBody').innerHTML=`<div style="text-align:center">已記錄 <b>${esc(c?c.name:'')}</b> ${m} ${u}</div><button class="btn" id="mOk">好</button>`;
    $('#modal').classList.add('show');$('#mOk').onclick=()=>$('#modal').classList.remove('show');
    SHOT=null;saveShot();drawGPS()});
  box.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{if(!G.pos)return;const k=b.dataset.mark;GREENS[h+1]=Object.assign(GREENS[h+1]||{},{[k]:{...G.pos}});if(!GREENS.center)GREENS.center={...G.pos};saveGreens();drawGPS()});
  on('markClear',()=>confirmBox('要清除這洞的果嶺標記嗎？',()=>{delete GREENS[h+1];saveGreens();drawGPS()}));
}

function pickShotClub(){
  const clubs=BAG.clubs.slice().sort((a,b)=>(cstat(b).avg||0)-(cstat(a).avg||0));
  $('#modalBody').innerHTML=`<b>這一桿用哪支球桿？</b><div style="font-size:13px;color:var(--mute);margin:4px 0 8px">選好後就從現在的位置開始量，打完走到球旁邊再按「儲存」。</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:50vh;overflow:auto">${clubs.map(c=>`<button class="btn ghost sm" data-pick="${c.id}" style="margin:0;width:100%">${esc(c.name)}</button>`).join('')}</div>
    <button class="btn ghost" id="mNo">取消</button>`;
  $('#modal').classList.add('show');
  $('#mNo').onclick=()=>$('#modal').classList.remove('show');
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(!G.pos)return;SHOT={club:b.dataset.pick,start:{...G.pos},t:Date.now()};saveShot();$('#modal').classList.remove('show');drawGPS()});
}

// ---------- 衛星地圖 ----------
const SAT={map:null,el:null,layer:null,osm:null,mode:'hole',markMode:null,target:null,focusKey:null,results:null};
const MARKNAME={f:'前緣',c:'中心',b:'後緣',sand:'沙坑',water:'水池'};
const ll=p=>[p.lat,p.lon];
function mountSat(slotId,mode,height){
  const slot=document.getElementById(slotId);if(!slot)return;
  if(!window.L){slot.innerHTML='<div class="hint" style="padding:16px;text-align:center">衛星地圖載入失敗。第一次使用需要網路；在 Claude 的預覽頁面裡也無法顯示，請用 liyuan02-maker.github.io/golf 開啟。</div>';return}
  if(!SAT.el){SAT.el=document.createElement('div');SAT.el.className='satmap'}
  SAT.el.style.height=height;slot.appendChild(SAT.el);
  if(!SAT.map){
    SAT.map=L.map(SAT.el,{zoomControl:true,attributionControl:true});
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {maxNativeZoom:19,maxZoom:20,crossOrigin:true,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}).addTo(SAT.map);
    SAT.layer=L.layerGroup().addTo(SAT.map);
    SAT.map.on('click',onSatClick);
    SAT.map.setView([23.7,121],7);
  }
  SAT.mode=mode;
  setTimeout(()=>{SAT.map.invalidateSize();focusSat();drawSat();drawSatInfo()},0);
}
function focusSat(force){
  if(!SAT.map||!S)return;
  const key=SAT.mode+':'+S.course+':'+(SAT.mode==='hole'?S.cur:'');
  if(!force&&key===SAT.focusKey)return;
  SAT.focusKey=key;SAT.target=null;SAT.markMode=null;
  if(SAT.mode==='hole'){
    const go=greenOf(S.cur),g=go.m,pts=[g.f,go.c,g.b].filter(Boolean);
    if(pts.length){const b=pts.map(ll);if(G.pos&&distM(G.pos,pts[0])<700)b.push(ll(G.pos));
      b.length>1?SAT.map.fitBounds(b,{padding:[40,40],maxZoom:18}):SAT.map.setView(b[0],17);return}
  }else{
    const cs=[];for(let n=1;n<=S.holes;n++){const go=greenOf(n-1);if(go.c)cs.push(ll(go.c))}
    if(cs.length>1){SAT.map.fitBounds(cs,{padding:[30,30],maxZoom:17});return}
  }
  if(G.pos)SAT.map.setView(ll(G.pos),17);
  else if(GREENS.center)SAT.map.setView(ll(GREENS.center),16);
}
function pin(txt,cls){return L.divIcon({className:'',html:`<div class="pin ${cls||''}">${txt}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}
function tip(layer,txt){layer.bindTooltip(txt,{permanent:true,direction:'center',className:'dist-tip'})}
const blank=()=>L.divIcon({className:'',html:''});
function midTip(a,b,txt){tip(L.marker([(a.lat+b.lat)/2,(a.lon+b.lon)/2],{icon:blank(),interactive:false}).addTo(SAT.layer),txt)}
// 球場資料（果嶺、沙坑、水池）畫在衛星圖上
function drawOSMLayer(){
  if(!SAT.map)return;
  if(!SAT.osm)SAT.osm=L.layerGroup().addTo(SAT.map);
  SAT.osm.clearLayers();
  if(OSM){
    OSM.greens.forEach(g=>L.polygon(g.pts.map(ll),{color:'#b8f28f',weight:1.5,fillOpacity:.12,interactive:false}).addTo(SAT.osm));
    OSM.hz.forEach(z=>L.polygon(z.pts.map(ll),{color:z.t==='water'?'#3fa9f5':'#f3d36b',weight:1.5,fillOpacity:.3,interactive:false}).addTo(SAT.osm));
  }
  (GREENS.hz||[]).forEach((p,i)=>{const m=L.marker(ll(p),{icon:pin(p.t==='water'?'💧':'⛱','hz')}).addTo(SAT.osm);
    m.on('click',()=>confirmBox(`要刪除這個${p.t==='water'?'水池':'沙坑'}標記嗎？`,()=>{GREENS.hz.splice(i,1);saveGreens();drawOSMLayer();drawGPS()}))});
}
function drawSat(){
  if(!SAT.map||!S)return;
  if(!SAT.osm)drawOSMLayer();
  if(G.pos&&SAT.map.getZoom()<10)SAT.map.setView(ll(G.pos),17);
  SAT.layer.clearLayers();const u=BAG.unit;
  if(SAT.mode==='hole'){
    const go=greenOf(S.cur),g=go.m;
    const front=G.pos&&greenDists(S.cur);
    if(G.pos&&go.c&&!SAT.target){L.polyline([ll(G.pos),ll(go.c)],{color:'#fff',weight:2,dashArray:'6 6',interactive:false}).addTo(SAT.layer);
      midTip(G.pos,go.c,front&&front.f!=null?`前緣 ${(front.fEst?'≈':'')+toU(front.f)} ${u}`:`${toU(distM(G.pos,go.c))} ${u}`)}
    if(SAT.target){const t=SAT.target;
      if(G.pos){L.polyline([ll(G.pos),ll(t)],{color:'#ffd84d',weight:3,interactive:false}).addTo(SAT.layer);midTip(G.pos,t,`${toU(distM(G.pos,t))} ${u}`)}
      if(go.c){L.polyline([ll(t),ll(go.c)],{color:'#fff',weight:2,dashArray:'6 6',interactive:false}).addTo(SAT.layer);midTip(t,go.c,`${toU(distM(t,go.c))} ${u}`)}
      L.marker(ll(t),{icon:pin('◎','t'),interactive:false}).addTo(SAT.layer);
    }
    if(go.poly)L.polygon(go.poly.map(ll),{color:'#fff',weight:2,fillOpacity:0,interactive:false}).addTo(SAT.layer);
    ['f','b'].forEach(k=>{if(g[k])L.marker(ll(g[k]),{icon:pin(MARKNAME[k][0]),interactive:false}).addTo(SAT.layer)});
    if(go.c)L.marker(ll(go.c),{icon:pin('⛳','c'),interactive:false}).addTo(SAT.layer);
  }else{
    for(let n=1;n<=S.holes;n++){const go=greenOf(n-1);if(go.c){const m=L.marker(ll(go.c),{icon:pin(n,'c')}).addTo(SAT.layer);
      m.on('click',()=>{S.cur=n-1;save();view='play';render();window.scrollTo(0,0)})}}
  }
  if(G.pos){if(G.acc)L.circle(ll(G.pos),{radius:G.acc,color:'#4da3ff',weight:1,fillOpacity:.15,interactive:false}).addTo(SAT.layer);
    L.circleMarker(ll(G.pos),{radius:8,color:'#fff',weight:3,fillColor:'#1e88ff',fillOpacity:1,interactive:false}).addTo(SAT.layer)}
}
function onSatClick(e){
  if(!S)return;const p={lat:e.latlng.lat,lon:e.latlng.lng};
  if(SAT.mode==='hole'&&SAT.markMode){
    if(SAT.markMode==='sand'||SAT.markMode==='water'){(GREENS.hz=GREENS.hz||[]).push({t:SAT.markMode,...p});saveGreens();drawOSMLayer()}
    else{const h=S.cur;GREENS[h+1]=Object.assign(GREENS[h+1]||{},{[SAT.markMode]:p})}
    if(!GREENS.center)GREENS.center=p;saveGreens();SAT.markMode=null;drawGPS();return}
  if(SAT.mode==='hole'){SAT.target=p;drawSat();drawSatInfo()}
}
function drawSatInfo(){
  const el=document.getElementById('satInfo');if(!el||!S)return;const u=BAG.unit;
  const on=(id,f)=>{const x=document.getElementById(id);if(x)x.onclick=f};
  if(SAT.mode==='hole'){
    const g=GREENS[S.cur+1]||{},go=greenOf(S.cur);let t='';
    if(SAT.markMode)t=`<div class="markbar"><span>👆 點一下衛星圖上${SAT.markMode==='sand'||SAT.markMode==='water'?`<b>${MARKNAME[SAT.markMode]}</b>靠近你的邊緣`:`果嶺的<b>${MARKNAME[SAT.markMode]}</b>`}</span><button class="btn sm" id="mkCancel" style="margin:0 0 0 8px">取消</button></div>`;
    else if(SAT.target){const d1=G.pos?distM(G.pos,SAT.target):null,d2=go.c?toU(distM(SAT.target,go.c)):null;
      t=`<div style="font-size:15px;margin:4px 0">◎ 目標點${d1!=null?`：離你 <b>${toU(d1)}</b> ${u}`:''}${d2!=null?`，到果嶺中心 <b>${d2}</b> ${u}`:''}</div>
        <div class="mapbtns">${d1!=null?`<button class="btn" id="tgAsk">🧢 用 ${toU(d1)} ${u} 問桿弟</button>`:''}<button class="btn ghost" id="tgClear" style="flex:0 0 80px">清除</button></div>`}
    else t=`<div class="hint" style="margin-top:4px">點地圖上任一點，可以看到你到那裡、那裡到果嶺的距離。</div>`;
    t+=`<div style="font-size:13px;color:var(--mute);margin-top:8px">在衛星圖上標記果嶺${go.poly&&!g.c?'（已從地圖資料自動找到）':g.c?'（已標記）':''}：</div>
      <div class="parsel" style="margin-top:4px">${['f','c','b'].map(k=>`<button data-smark="${k}" class="${SAT.markMode===k?'on':''}">${MARKNAME[k]}${g[k]?' ✓':''}</button>`).join('')}</div>
      <div style="font-size:13px;color:var(--mute);margin-top:8px">標記障礙物（點圖上的標記可以刪除）：</div>
      <div class="parsel" style="margin-top:4px">${['sand','water'].map(k=>`<button data-smark="${k}" class="${SAT.markMode===k?'on':''}">${k==='sand'?'⛱ 沙坑':'💧 水池'}</button>`).join('')}</div>`;
    el.innerHTML=t;
    on('mkCancel',()=>{SAT.markMode=null;drawSatInfo()});
    on('tgClear',()=>{SAT.target=null;drawSat();drawSatInfo()});
    on('tgAsk',()=>askCaddie(distM(G.pos,SAT.target),bearing(G.pos,SAT.target)));
    el.querySelectorAll('[data-smark]').forEach(b=>b.onclick=()=>{SAT.markMode=b.dataset.smark;SAT.target=null;drawSat();drawSatInfo()});
  }else{
    let n=0;for(let i=0;i<S.holes;i++)if(greenOf(i).c)n++;
    el.innerHTML=`<div class="row" style="margin-top:8px"><input id="cSearch" placeholder="搜尋球場，例如：林口 高爾夫" value="${esc(S.course||'')}"><button class="btn sm" id="cGo" style="margin:0;white-space:nowrap">搜尋</button></div>
      <div id="cRes"></div>
      <button class="btn ghost" id="osmGo" ${OSMST.busy?'disabled':''}>${OSMST.busy?'載入中⋯':'⬇︎ 載入這裡的果嶺、沙坑、水池資料'}</button>
      ${OSMST.msg?`<div class="hint">${OSMST.msg}</div>`:''}
      <div class="hint">已有 ${n} / ${S.holes} 洞的果嶺位置。點圖上的洞號可以跳到那一洞。資料來自 OpenStreetMap，不一定每個球場都有；沒有的話可以在記分頁的衛星圖手動標記。</div>`;
    const go=async()=>{const q=$('#cSearch').value.trim();if(!q)return;$('#cRes').innerHTML='<div class="hint">搜尋中⋯</div>';
      try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=zh-TW&q='+encodeURIComponent(q));const js=await r.json();
        if(!js.length){$('#cRes').innerHTML='<div class="hint">找不到，換個關鍵字試試，或直接拖曳地圖找到球場。</div>';return}
        $('#cRes').innerHTML=js.map((x,i)=>`<button class="btn ghost" data-res="${i}" style="text-align:left;font-size:14px;font-weight:400;margin-top:6px">${esc(x.display_name)}</button>`).join('');
        $('#cRes').querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{const x=js[+b.dataset.res];GREENS.center={lat:+x.lat,lon:+x.lon};saveGreens();SAT.map.setView([+x.lat,+x.lon],16);$('#cRes').innerHTML='';fetchOSM(GREENS.center,true)})
      }catch(e){$('#cRes').innerHTML='<div class="hint">搜尋失敗，請確認手機有網路。</div>'}};
    on('cGo',go);$('#cSearch').onkeydown=e=>{if(e.key==='Enter')go()};
    on('osmGo',()=>{const c=SAT.map.getCenter();fetchOSM({lat:c.lat,lon:c.lng},true)});
  }
}

function confirmBox(msg,ok){
  $('#modalBody').innerHTML=`<div>${msg}</div><div class="row"><button class="btn ghost" id="mNo">取消</button><button class="btn" id="mYes">確定</button></div>`;
  $('#modal').classList.add('show');
  $('#mNo').onclick=()=>$('#modal').classList.remove('show');
  $('#mYes').onclick=()=>{$('#modal').classList.remove('show');ok()};
}

$('#mapFile').onchange=async e=>{
  const f=e.target.files[0];if(!f||!uploadTarget)return;
  try{const old=MAPS[uploadTarget];MAPS[uploadTarget]=await compress(f);
    if(!saveMaps()){if(old)MAPS[uploadTarget]=old;else delete MAPS[uploadTarget];
      $('#modalBody').innerHTML='<div>手機的儲存空間不夠，存不下這張圖。可以先刪掉幾張舊地圖再試試看。</div><button class="btn" onclick="document.getElementById(\'modal\').classList.remove(\'show\')">好</button>';$('#modal').classList.add('show')}
  }catch(err){}
  render();
};
$('#vClose').onclick=()=>$('#viewer').classList.remove('show');
$('#gear').onclick=()=>{view='setup';render();window.scrollTo(0,0)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0)});
render();
// 一進來就自動開啟 GPS（有進行中的球局時）
if(S)startGPS();
// 有些手機要使用者點過畫面後才允許保持螢幕亮著
document.addEventListener('click',()=>{if(G.on&&!G.lock)keepAwake()},{passive:true});
if('serviceWorker' in navigator && location.protocol==='https:' && window.top===window.self){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
